<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero-card">
      <div class="hero-badge">Register > Login > Profile</div>
      <h1>Secure user portal</h1>
      <p class="hero-copy">Create an account, log in with your registered details, and update your profile information in a separate profile page.</p>
      <div class="hero-actions">
        <a class="btn btn-primary btn-lg" href="register.html">Create account</a>
        <a class="btn btn-outline-light btn-lg" href="login.html">Log in</a>
      </div>
    </section>
  </main>

  <script>
    const sessionToken = localStorage.getItem('session_token');
    if (sessionToken) {
      window.location.href = 'profile.html';
    }
  </script>
</body>
</html>
