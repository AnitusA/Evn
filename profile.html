<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="profile-shell">
    <section class="profile-card">
      <div class="profile-topbar">
        <div>
          <div class="auth-kicker">Step 3</div>
          <h1>Your profile</h1>
          <p>Edit additional profile details stored in MongoDB.</p>
        </div>
        <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
      </div>

      <div id="profileAlert" class="alert d-none" role="alert"></div>

      <div class="profile-summary">
        <div><span>Full name</span><strong id="summaryName">-</strong></div>
        <div><span>Username</span><strong id="summaryUsername">-</strong></div>
        <div><span>Email</span><strong id="summaryEmail">-</strong></div>
      </div>

      <form id="profileForm" class="auth-form profile-form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="age">Age</label>
            <input class="form-control" type="number" id="age" name="age" min="0">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="dob">Date of birth</label>
            <input class="form-control" type="date" id="dob" name="dob">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="contact">Contact</label>
            <input class="form-control" type="text" id="contact" name="contact">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="city">City</label>
            <input class="form-control" type="text" id="city" name="city">
          </div>
          <div class="col-12">
            <label class="form-label" for="address">Address</label>
            <textarea class="form-control" id="address" name="address" rows="3"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label" for="bio">Bio</label>
            <textarea class="form-control" id="bio" name="bio" rows="4"></textarea>
          </div>
        </div>

        <button class="btn btn-primary w-100 mt-4" type="submit">Save profile</button>
      </form>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
