<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-head">
        <div class="auth-kicker">Step 2</div>
        <h1>Log in</h1>
        <p>Use the details created during registration.</p>
      </div>

      <div id="loginAlert" class="alert d-none" role="alert"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="identifier">Username or email</label>
          <input class="form-control" type="text" id="identifier" name="identifier" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="loginPassword">Password</label>
          <input class="form-control" type="password" id="loginPassword" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
        <p class="auth-footer">New user? <a href="register.html">Register first</a></p>
      </form>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
