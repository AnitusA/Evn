<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-head">
        <div class="auth-kicker">Step 1</div>
        <h1>Create account</h1>
        <p>Register once, then use the same details to log in.</p>
      </div>

      <div id="registerAlert" class="alert d-none" role="alert"></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="fullName">Full name</label>
            <input class="form-control" type="text" id="fullName" name="full_name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" type="text" id="username" name="username" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-control" type="password" id="confirmPassword" name="confirm_password" required>
          </div>
        </div>

        <button class="btn btn-primary w-100 mt-4" type="submit">Register</button>
        <p class="auth-footer">Already registered? <a href="login.html">Log in here</a></p>
      </form>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
